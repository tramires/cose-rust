[package]
name = "cose-rust"
version = "0.1.8"
authors = ["Tiago Ramires"]
license = "MIT"
description = "COSE Rust implementation"
repository = "https://github.com/tramires/cose-rust"
readme = "README.md"
keywords = ["cose", "mac", "encryption", "cbor", "signature"]
categories = ["cryptography", "encoding"]
edition = "2018"

[lib]
name = "cose"

[dependencies]
cbor-codec = "0.7.1"
openssl = "0.10"
rand = "0.8.3"
hex = { version = "0.4.3", optional = true }
serde_json = { version = "1.0.64", optional = true }

[features]
# Vendored OpenSSL is the default and does not use the system library.
# `default-features = false` links against system libssl, which must be
# OpenSSL >= 3.2 (ECDSA deterministic nonces).
default = ["openssl-vendored"]
openssl-vendored = ["openssl/vendored"]
json = ["hex", "serde_json"]
