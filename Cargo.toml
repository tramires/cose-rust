[package]
name = "cose-rust"
version = "0.1.10"
authors = ["Tiago Ramires"]
license = "MIT"
description = "COSE Rust implementation"
repository = "https://github.com/tramires/cose-rust"
readme = "README.md"
keywords = ["cose", "mac", "encryption", "cbor", "signature"]
categories = ["cryptography", "encoding"]
edition = "2018"
rust-version = "1.82"

[lib]
name = "cose"

[dependencies]
cbor-codec = "0.7.1"
openssl = "0.10.81"

[features]
default = ["openssl_vendored"] 
openssl_vendored = ["openssl/vendored"]

[dev-dependencies]
hex = "0.4.3"
serde_json = {version="1.0.103", features=["preserve_order"]}
base64= "0.21.2"
